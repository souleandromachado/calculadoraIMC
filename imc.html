<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result-box h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .result-box p {
            font-size: 22px;
            font-weight: bold;
        }

        /* Cores dos resultados */
        .magreza { background-color: #e3f2fd; color: #0d47a1; }
        .normal { background-color: #e8f5e9; color: #1b5e20; }
        .sobrepeso { background-color: #fff3e0; color: #e65100; }
        .obesidade { background-color: #ffebee; color: #b71c1c; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de IMC</h2>
    
    <div class="input-group">
        <label for="peso">Peso (kg)</label>
        <input type="number" id="peso" placeholder="Ex: 75.5" step="0.1" min="0">
    </div>

    <div class="input-group">
        <label for="altura">Altura (m)</label>
        <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0">
    </div>

    <button onclick="calcularIMC()">Calcular</button>

    <div id="resultado" class="result-box">
        <h3 id="classificacao"></h3>
        <p id="valor-imc"></p>
    </div>
</div>

<script>
    function calcularIMC() {
        const peso = parseFloat(document.getElementById('peso').value);
        const altura = parseFloat(document.getElementById('altura').value);
        const resultBox = document.getElementById('resultado');
        const classifText = document.getElementById('classificacao');
        const valorText = document.getElementById('valor-imc');

        // Validação simples
        if (!peso || !altura || peso <= 0 || altura <= 0) {
            alert('Por favor, insira valores válidos para peso e altura.');
            return;
        }

        // Cálculo do IMC: peso / (altura * altura)
        const imc = (peso / (altura * altura)).toFixed(1);

        // Reset de classes anteriores
        resultBox.className = 'result-box';
        
        let classificacao = '';
        let classeCss = '';

        // Lógica baseada nos intervalos solicitados
        if (imc < 18.5) {
            classificacao = 'Magreza';
            classeCss = 'magreza';
        } else if (imc >= 18.5 && imc < 24.9) {
            classificacao = 'Normal';
            classeCss = 'normal';
        } else if (imc >= 24.9 && imc < 30) {
            classificacao = 'Sobrepeso';
            classeCss = 'sobrepeso';
        } else {
            classificacao = 'Obesidade';
            classeCss = 'obesidade';
        }

        // Atualiza a interface
        classifText.textContent = classificacao;
        valorText.textContent = `IMC: ${imc} kg/m²`;
        resultBox.classList.add(classeCss);
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>
